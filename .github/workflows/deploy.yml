name: Deploy Microservices to Azure Container Apps

on:
  push:
    branches:
      - feature/cicd-setup

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

# Define global variables so all jobs can easily access them
env:
  IMAGE_TAG: ${{ github.sha }}
  AZURE_RESOURCE_GROUP: rg-ruhuna-auction
  AZURE_LOCATION: centralus

jobs:
  # 1. NEW JOB: Ensure Resource Group and ACR exist before building
  ensure-base-infra:
    name: Ensure Base Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create RG and ACR (Idempotent)
        shell: bash
        run: |
          set -euo pipefail
          
          ACR_NAME="${{ secrets.ACR_LOGIN_SERVER }}"
          ACR_NAME="${ACR_NAME%%.azurecr.io}"

          echo "Ensuring Resource Group '$AZURE_RESOURCE_GROUP' exists in '$AZURE_LOCATION'..."
          az group create --name "$AZURE_RESOURCE_GROUP" --location "$AZURE_LOCATION"

          echo "Ensuring Container Registry '$ACR_NAME' exists..."
          az acr create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$ACR_NAME" \
            --sku Basic \
            --admin-enabled true

  # 2. Build images (Waits for ensure-base-infra to finish)
  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: ensure-base-infra
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - auction-service
          - bid-service
          - notification-service
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image with ACR
        shell: bash
        run: |
          set -euo pipefail

          ACR_NAME="${{ secrets.ACR_LOGIN_SERVER }}"
          ACR_NAME="${ACR_NAME%%.azurecr.io}"

          az acr build \
            --registry "$ACR_NAME" \
            --image "${{ matrix.service }}:${IMAGE_TAG}" \
            --file "${{ matrix.service }}/Dockerfile" \
            .

  # 3. Deploy the rest of the infrastructure and apps (Waits for build-and-push)
  deploy-infrastructure:
    name: Deploy Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep template
        shell: bash
        run: |
          set -euo pipefail

          POSTGRESQL_SERVER_NAME="${POSTGRESQL_SERVER_NAME:-pg-ruhuna-auction}"
          POSTGRESQL_ADMIN_USERNAME="${POSTGRESQL_ADMIN_USERNAME:-pgadmin}"
          REDIS_CACHE_NAME="${REDIS_CACHE_NAME:-redis-ruhuna-auction}"

          az deployment group create \
            --name "deploy-${IMAGE_TAG}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/container-apps.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              acrLoginServer="${{ secrets.ACR_LOGIN_SERVER }}" \
              acrUsername="${{ secrets.ACR_USERNAME }}" \
              acrPassword="${{ secrets.ACR_PASSWORD }}" \
              postgresqlServerName="$POSTGRESQL_SERVER_NAME" \
              postgresqlAdminUsername="$POSTGRESQL_ADMIN_USERNAME" \
              postgresqlAdminPassword="${{ secrets.DB_PASSWORD }}" \
              redisCacheName="$REDIS_CACHE_NAME" \
              jwtSecret="${{ secrets.JWT_SECRET }}" \
              dbPassword="${{ secrets.DB_PASSWORD }}" \
              rabbitmqHost="${{ secrets.RABBITMQ_HOST }}" \
              rabbitmqUsername="${{ secrets.RABBITMQ_USERNAME }}" \
              rabbitmqPassword="${{ secrets.RABBITMQ_PASSWORD }}" \
              googleClientId="${{ secrets.GOOGLE_CLIENT_ID }}" \
              googleClientSecret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              appOAuth2RedirectUri="${{ secrets.APP_OAUTH2_REDIRECT_URI }}" \
              zipkinUrl="${{ secrets.ZIPKIN_URL }}" \
              imageTag="$IMAGE_TAG"