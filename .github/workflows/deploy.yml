name: Deploy Microservices to Azure Container Apps

on:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_TAG: ${{ github.sha }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  tests:
    name: Test ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            path: api-gateway
          - name: user-service
            path: user-service
          - name: auction-service
            path: auction-service
          - name: bid-service
            path: bid-service
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw
        working-directory: ${{ matrix.service.path }}

      - name: Run tests and quality checks
        run: ./mvnw -B clean verify
        working-directory: ${{ matrix.service.path }}

  sast-scan:
    name: SAST Scan (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build all services for analysis
        run: |
          for service in api-gateway user-service auction-service bid-service; do
            cd $service
            chmod +x mvnw
            ./mvnw -B -DskipTests compile
            cd ..
          done

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  dependency-scan:
    name: Dependency Scan (OWASP)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            path: api-gateway
          - name: user-service
            path: user-service
          - name: auction-service
            path: auction-service
          - name: bid-service
            path: bid-service
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/DependencyCheck-Action@main
        with:
          project: ${{ matrix.service.name }}
          path: ./${{ matrix.service.path }}
          format: 'HTML'
          args: >
            --failBuildOnCVSS 7
            --enableRetired true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report-${{ matrix.service.name }}
          path: ${{github.workspace}}/reports

  build-and-push:
    name: Build and push ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [tests, sast-scan, dependency-scan]
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            path: api-gateway
            dockerfile: api-gateway/Dockerfile
            image: api-gateway
          - name: user-service
            path: user-service
            dockerfile: user-service/Dockerfile
            image: user-service
          - name: auction-service
            path: auction-service
            dockerfile: auction-service/Dockerfile
            image: auction-service
          - name: bid-service
            path: bid-service
            dockerfile: bid-service/Dockerfile
            image: bid-service
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service.path }}
          file: ./${{ matrix.service.dockerfile }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service.image }}:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-azure-container-apps:
    name: Deploy ${{ matrix.service.name }} to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            image: api-gateway
          - name: user-service
            image: user-service
          - name: auction-service
            image: auction-service
          - name: bid-service
            image: bid-service
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App image and registry
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail

            case "${{ matrix.service.name }}" in
              api-gateway)
                APP_NAME="${{ vars.AZURE_API_GATEWAY_CONTAINER_APP_NAME }}"
                ;;
              user-service)
                APP_NAME="${{ vars.AZURE_USER_SERVICE_CONTAINER_APP_NAME }}"
                ;;
              auction-service)
                APP_NAME="${{ vars.AZURE_AUCTION_SERVICE_CONTAINER_APP_NAME }}"
                ;;
              bid-service)
                APP_NAME="${{ vars.AZURE_BID_SERVICE_CONTAINER_APP_NAME }}"
                ;;
              *)
                echo "Unknown service: ${{ matrix.service.name }}"
                exit 1
                ;;
            esac

            az containerapp registry set \
              --name "$APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --server "${{ secrets.ACR_LOGIN_SERVER }}" \
              --username "${{ secrets.ACR_USERNAME }}" \
              --password "${{ secrets.ACR_PASSWORD }}"

            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service.image }}:${{ github.sha }}"
