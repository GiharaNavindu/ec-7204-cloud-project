version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: auction-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"

  mongodb:
    image: mongo:6.0
    container_name: auction-mongodb
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    container_name: auction-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: auction-rabbitmq
    ports:
      - "5672:5672"   # Message port
      - "15672:15672" # Management UI port

  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: discovery-server
    environment:
      EUREKA_HOSTNAME: discovery-server
    ports:
      - "8761:8761"

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/user_db
      DB_USERNAME: admin
      DB_PASSWORD: password
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    depends_on:
      - postgres
      - discovery-server
    ports:
      - "8081:8081"

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      - discovery-server
      - user-service
    ports:
      - "8080:8080"