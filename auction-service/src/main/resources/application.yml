server:
  port: 8082

spring:
  application:
    name: auction-service
  
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Merged RabbitMQ configuration here under the single 'spring:' key
  rabbitmq:
    host: ${RABBITMQ_HOST:}
    port: 5672
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:86400000}

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

rabbitmq:
  exchange: auction.exchange