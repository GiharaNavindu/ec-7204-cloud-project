server:
  port: 8082

spring:
  application:
    name: auction-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/auction_db  # postgres instance - auction database
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgresSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/  # point to the discovery server