global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080

  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - user-service:8081

  - job_name: auction-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - auction-service:8082

  - job_name: bid-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - bid-service:8083

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - notification-service:8085
