groups:
  - name: api-gateway-alerts
    interval: 30s
    rules:
      - alert: ApiGatewayHigh5xxRate
        expr: sum(rate(http_server_requests_seconds_count{application="api-gateway",status=~"5.."}[5m])) > 0.5
        for: 2m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: "High 5xx error rate on API Gateway"
          description: "API Gateway is producing more than 0.5 5xx responses/sec over 5m."

      - alert: ApiGatewayRateLimitSpike
        expr: sum(rate(http_server_requests_seconds_count{application="api-gateway",status="429"}[5m])) > 0.5
        for: 1m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: "High throttling rate on API Gateway"
          description: "Gateway is returning many 429 responses. Check client load and limits."

      - alert: ApiGatewayReadinessDown
        expr: up{job="api-gateway"} == 0
        for: 2m
        labels:
          severity: critical
          service: api-gateway
        annotations:
          summary: "API Gateway readiness probe failing"
          description: "Prometheus cannot scrape the API Gateway metrics endpoint continuously."

  - name: notification-service-alerts
    interval: 30s
    rules:
      - alert: NotificationQueueHighLag
        expr: increase(rabbitmq_queue_messages_unacked_total{queue="notifications.queue"}[5m]) > 100
        for: 5m
        labels:
          severity: warning
          service: notification-service
        annotations:
          summary: "Notification queue has high lag"
          description: "Notification service queue has more than 100 unacked messages. Event processing may be slow."

      - alert: NotificationHighFailureRate
        expr: sum(rate(http_server_requests_seconds_count{application="notification-service",status=~"5.."}[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
          service: notification-service
        annotations:
          summary: "High error rate on Notification Service"
          description: "Notification Service is returning more than 0.2 5xx responses/sec over 5m."

      - alert: NotificationServiceDown
        expr: up{job="notification-service"} == 0
        for: 2m
        labels:
          severity: critical
          service: notification-service
        annotations:
          summary: "Notification Service readiness probe failing"
          description: "Prometheus cannot scrape the Notification Service metrics endpoint."
