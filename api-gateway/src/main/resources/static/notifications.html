<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuctionHub — Notifications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
          --bg: #0a0a0f;
          --surface: #13131a;
          --surface2: #1a1a24;
          --border: #1e1e2e;
          --accent: #f97316;
          --accent2: #fb923c;
          --text: #f1f0ee;
          --muted: #6b6b7b;
          --success: #22c55e;
          --error: #ef4444;
          --warning: #eab308;
          --unread-bg: #1a1610;
          --unread-border: rgba(249,115,22,0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          font-family: 'DM Sans', sans-serif;
          background: var(--bg);
          color: var(--text);
          min-height: 100vh;
        }

        /* NAV */
        nav {
          background: var(--surface);
          border-bottom: 1px solid var(--border);
          padding: 1rem 2rem;
          display: flex;
          align-items: center;
          justify-content: space-between;
          position: sticky;
          top: 0;
          z-index: 100;
        }

        .logo {
          font-family: 'Syne', sans-serif;
          font-size: 1.3rem;
          font-weight: 800;
          letter-spacing: -0.02em;
          text-decoration: none;
          color: var(--text);
        }
        .logo span { color: var(--accent); }

        .nav-right {
          display: flex;
          align-items: center;
          gap: 1rem;
        }

        .nav-link {
          color: var(--muted);
          text-decoration: none;
          font-size: 0.9rem;
          transition: color 0.2s;
        }
        .nav-link:hover { color: var(--text); }

        .btn-logout {
          background: transparent;
          border: 1px solid var(--border);
          color: var(--muted);
          padding: 0.4rem 0.9rem;
          border-radius: 100px;
          font-family: 'DM Sans', sans-serif;
          font-size: 0.85rem;
          cursor: pointer;
          transition: all 0.2s;
        }
        .btn-logout:hover { border-color: var(--error); color: var(--error); }

        /* MAIN */
        main {
          max-width: 760px;
          margin: 0 auto;
          padding: 2.5rem 2rem;
        }

        .page-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 2rem;
          flex-wrap: wrap;
          gap: 1rem;
        }

        .page-header h1 {
          font-family: 'Syne', sans-serif;
          font-size: 2rem;
          font-weight: 800;
          letter-spacing: -0.03em;
        }

        .unread-badge-large {
          background: rgba(249,115,22,0.15);
          border: 1px solid rgba(249,115,22,0.3);
          color: var(--accent);
          font-size: 0.8rem;
          font-weight: 600;
          padding: 0.3rem 0.75rem;
          border-radius: 100px;
          margin-left: 0.75rem;
        }

        .header-actions {
          display: flex;
          gap: 0.75rem;
        }

        .btn-mark-all {
          background: transparent;
          border: 1px solid var(--border);
          color: var(--muted);
          padding: 0.5rem 1rem;
          border-radius: 8px;
          font-family: 'DM Sans', sans-serif;
          font-size: 0.85rem;
          cursor: pointer;
          transition: all 0.2s;
        }
        .btn-mark-all:hover { border-color: var(--accent); color: var(--accent); }
        .btn-mark-all:disabled { opacity: 0.4; cursor: not-allowed; }

        /* FILTER TABS */
        .filter-bar {
          display: flex;
          gap: 0.5rem;
          margin-bottom: 1.5rem;
        }

        .filter-btn {
          padding: 0.4rem 1rem;
          border-radius: 100px;
          border: 1px solid var(--border);
          background: transparent;
          color: var(--muted);
          font-family: 'DM Sans', sans-serif;
          font-size: 0.85rem;
          cursor: pointer;
          transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
          background: var(--accent);
          border-color: var(--accent);
          color: white;
        }

        /* NOTIFICATION LIST */
        .notifications-list {
          display: flex;
          flex-direction: column;
          gap: 0.75rem;
        }

        .notif-item {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 1.25rem;
          display: flex;
          gap: 1rem;
          align-items: flex-start;
          cursor: pointer;
          transition: all 0.2s;
          position: relative;
        }

        .notif-item:hover { border-color: rgba(249,115,22,0.3); }

        .notif-item.unread {
          background: var(--unread-bg);
          border-color: var(--unread-border);
        }

        .notif-item.unread::before {
          content: '';
          position: absolute;
          left: -1px;
          top: 20%;
          bottom: 20%;
          width: 3px;
          background: var(--accent);
          border-radius: 0 3px 3px 0;
        }

        .notif-icon {
          width: 40px;
          height: 40px;
          border-radius: 10px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 1.1rem;
          flex-shrink: 0;
        }

        .icon-bid { background: rgba(249,115,22,0.15); }
        .icon-auction { background: rgba(34,197,94,0.15); }
        .icon-payment { background: rgba(59,130,246,0.15); }
        .icon-outbid { background: rgba(239,68,68,0.15); }
        .icon-system { background: rgba(107,107,123,0.15); }
        .icon-win { background: rgba(234,179,8,0.15); }

        .notif-body { flex: 1; min-width: 0; }

        .notif-title {
          font-family: 'Syne', sans-serif;
          font-size: 0.95rem;
          font-weight: 700;
          margin-bottom: 0.25rem;
          display: flex;
          align-items: center;
          gap: 0.5rem;
        }

        .unread-dot {
          width: 7px;
          height: 7px;
          background: var(--accent);
          border-radius: 50%;
          flex-shrink: 0;
        }

        .notif-message {
          font-size: 0.875rem;
          color: var(--muted);
          line-height: 1.5;
          margin-bottom: 0.5rem;
        }

        .notif-time {
          font-size: 0.75rem;
          color: var(--muted);
          opacity: 0.7;
        }

        .notif-actions {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          flex-shrink: 0;
        }

        .btn-read {
          background: transparent;
          border: 1px solid var(--border);
          color: var(--muted);
          padding: 0.3rem 0.6rem;
          border-radius: 6px;
          font-size: 0.75rem;
          cursor: pointer;
          transition: all 0.2s;
          white-space: nowrap;
        }
        .btn-read:hover { border-color: var(--accent); color: var(--accent); }

        /* States */
        .loading-state, .empty-state {
          text-align: center;
          padding: 4rem 2rem;
          color: var(--muted);
        }

        .spinner {
          width: 32px; height: 32px;
          border: 3px solid var(--border);
          border-top-color: var(--accent);
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
          margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
        .empty-state h3 { font-family: 'Syne', sans-serif; margin-bottom: 0.5rem; }
        .empty-state p { font-size: 0.9rem; }

        /* Pagination */
        .pagination {
          display: flex;
          justify-content: center;
          gap: 0.5rem;
          margin-top: 2rem;
        }

        .page-btn {
          padding: 0.5rem 1rem;
          border: 1px solid var(--border);
          background: transparent;
          color: var(--muted);
          border-radius: 8px;
          font-family: 'DM Sans', sans-serif;
          font-size: 0.85rem;
          cursor: pointer;
          transition: all 0.2s;
        }
        .page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .page-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

        /* Toast */
        .toast {
          position: fixed;
          bottom: 2rem;
          right: 2rem;
          background: var(--surface);
          border: 1px solid var(--border);
          padding: 0.875rem 1.25rem;
          border-radius: 10px;
          font-size: 0.875rem;
          transform: translateY(100px);
          opacity: 0;
          transition: all 0.3s;
          z-index: 999;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-color: rgba(34,197,94,0.4); color: var(--success); }
        .toast.error { border-color: rgba(239,68,68,0.4); color: var(--error); }
    </style>
</head>
<body>

<nav>
    <a href="/auctions.html" class="logo">Auction<span>Hub</span></a>
    <div class="nav-right">
        <a href="/auctions.html" class="nav-link">← Auctions</a>
        <button class="btn-logout" onclick="logout()">Sign out</button>
    </div>
</nav>

<main>
    <div class="page-header">
        <div>
            <h1>
                Notifications
                <span class="unread-badge-large" id="unread-count-badge" style="display:none"></span>
            </h1>
        </div>
        <div class="header-actions">
            <button class="btn-mark-all" id="mark-all-btn" onclick="markAllRead()">
                Mark all as read
            </button>
        </div>
    </div>

    <div class="filter-bar">
        <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
        <button class="filter-btn" onclick="setFilter('unread', this)">Unread</button>
    </div>

    <div class="notifications-list" id="notifications-list">
        <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading notifications...</p>
        </div>
    </div>

    <div class="pagination" id="pagination"></div>
</main>

<div class="toast" id="toast"></div>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/index.html';

    // Decode userId from JWT payload
    function getUserId() {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        return payload.userId;
      } catch { return null; }
    }

    const userId = getUserId();
    if (!userId) { logout(); }

    let currentPage = 0;
    let totalPages = 0;
    let currentFilter = 'all';
    let allNotifications = [];

    // ── Notification type config ──────────────────────────────────
    const TYPE_CONFIG = {
      BID_PLACED:    { icon: '🔨', cls: 'icon-bid',     label: 'Bid Placed' },
      OUTBID:        { icon: '⚡', cls: 'icon-outbid',   label: 'Outbid' },
      AUCTION_WON:   { icon: '🏆', cls: 'icon-win',      label: 'Auction Won' },
      AUCTION_ENDED: { icon: '🔔', cls: 'icon-auction',  label: 'Auction Ended' },
      PAYMENT_SUCCESS: { icon: '💳', cls: 'icon-payment', label: 'Payment' },
      PAYMENT_FAILED:  { icon: '❌', cls: 'icon-payment', label: 'Payment Failed' },
      SYSTEM:        { icon: '⚙️', cls: 'icon-system',   label: 'System' },
    };

    function getTypeConfig(type) {
      return TYPE_CONFIG[type] || { icon: '🔔', cls: 'icon-system', label: type || 'Notification' };
    }

    // ── Time formatting ───────────────────────────────────────────
    function timeAgo(dateStr) {
      if (!dateStr) return '';
      const diff = Date.now() - new Date(dateStr);
      const m = Math.floor(diff / 60000);
      const h = Math.floor(diff / 3600000);
      const d = Math.floor(diff / 86400000);
      if (m < 1) return 'Just now';
      if (m < 60) return `${m}m ago`;
      if (h < 24) return `${h}h ago`;
      return `${d}d ago`;
    }

    // ── Load notifications ────────────────────────────────────────
    async function loadNotifications(page = 0) {
      const list = document.getElementById('notifications-list');
      list.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading...</p></div>';

      try {
        const res = await fetch(`/api/notifications/user/${userId}?page=${page}&size=15`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.status === 401) { logout(); return; }

        if (!res.ok) {
          showDemoNotifications();
          return;
        }

        const data = await res.json();
        // Handle paginated response: { content, totalPages, totalElements, ... }
        allNotifications = data.content || data.notifications || data || [];
        totalPages = data.totalPages || 1;
        currentPage = page;

        renderNotifications(allNotifications);
        renderPagination();
        loadUnreadCount();

      } catch (e) {
        showDemoNotifications();
      }
    }

    // ── Load unread count ─────────────────────────────────────────
    async function loadUnreadCount() {
      try {
        const res = await fetch(`/api/notifications/user/${userId}/unread-count`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) return;
        const data = await res.json();
        const count = data.count || data.unreadCount || 0;
        updateUnreadBadge(count);
      } catch (e) {}
    }

    function updateUnreadBadge(count) {
      const badge = document.getElementById('unread-count-badge');
      const markAllBtn = document.getElementById('mark-all-btn');
      if (count > 0) {
        badge.textContent = `${count} unread`;
        badge.style.display = 'inline';
        markAllBtn.disabled = false;
      } else {
        badge.style.display = 'none';
        markAllBtn.disabled = true;
      }
      // Also update navbar bell if present
      const navBell = document.getElementById('nav-unread-count');
      if (navBell) {
        navBell.textContent = count > 99 ? '99+' : count;
        navBell.style.display = count > 0 ? 'flex' : 'none';
      }
    }

    // ── Render ────────────────────────────────────────────────────
    function renderNotifications(notifications) {
      const list = document.getElementById('notifications-list');

      const filtered = currentFilter === 'unread'
        ? notifications.filter(n => !n.read && !n.isRead)
        : notifications;

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">${currentFilter === 'unread' ? '✅' : '🔔'}</div>
            <h3>${currentFilter === 'unread' ? 'All caught up!' : 'No notifications yet'}</h3>
            <p>${currentFilter === 'unread' ? 'You have no unread notifications.' : 'Notifications will appear here when you bid or win auctions.'}</p>
          </div>`;
        return;
      }

      list.innerHTML = filtered.map(n => {
        const cfg = getTypeConfig(n.type || n.notificationType);
        const isUnread = !n.read && !n.isRead;
        return `
          <div class="notif-item ${isUnread ? 'unread' : ''}" id="notif-${n.id}"
               onclick="handleNotifClick(${n.id}, ${isUnread})">
            <div class="notif-icon ${cfg.cls}">${cfg.icon}</div>
            <div class="notif-body">
              <div class="notif-title">
                ${isUnread ? '<span class="unread-dot"></span>' : ''}
                ${n.title || cfg.label}
              </div>
              <div class="notif-message">${n.message || n.content || 'No message'}</div>
              <div class="notif-time">${timeAgo(n.createdAt || n.timestamp)}</div>
            </div>
            ${isUnread ? `
            <div class="notif-actions">
              <button class="btn-read" onclick="event.stopPropagation(); markRead(${n.id})">
                Mark read
              </button>
            </div>` : ''}
          </div>`;
      }).join('');
    }

    // ── Mark single as read ───────────────────────────────────────
    async function markRead(id) {
      try {
        const res = await fetch(`/api/notifications/${id}/read`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) { showToast('Failed to mark as read', 'error'); return; }

        // Update UI without full reload
        const item = document.getElementById(`notif-${id}`);
        if (item) {
          item.classList.remove('unread');
          const dot = item.querySelector('.unread-dot');
          const actions = item.querySelector('.notif-actions');
          const beforeEl = item.querySelector('::before');
          if (dot) dot.remove();
          if (actions) actions.remove();
        }

        // Update count
        const badge = document.getElementById('unread-count-badge');
        if (badge && badge.style.display !== 'none') {
          const current = parseInt(badge.textContent) || 1;
          updateUnreadBadge(Math.max(0, current - 1));
        }

      } catch (e) {
        showToast('Could not reach notification service', 'error');
      }
    }

    // ── Mark all as read ──────────────────────────────────────────
    async function markAllRead() {
      const btn = document.getElementById('mark-all-btn');
      btn.disabled = true;
      btn.textContent = 'Marking...';

      try {
        const res = await fetch(`/api/notifications/user/${userId}/read-all`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) { showToast('Failed to mark all as read', 'error'); return; }

        showToast('All notifications marked as read', 'success');
        updateUnreadBadge(0);
        // Remove unread styling from all items
        document.querySelectorAll('.notif-item.unread').forEach(item => {
          item.classList.remove('unread');
          const dot = item.querySelector('.unread-dot');
          const actions = item.querySelector('.notif-actions');
          if (dot) dot.remove();
          if (actions) actions.remove();
        });

      } catch (e) {
        showToast('Could not reach notification service', 'error');
      } finally {
        btn.textContent = 'Mark all as read';
      }
    }

    // ── Handle click ──────────────────────────────────────────────
    function handleNotifClick(id, isUnread) {
      if (isUnread) markRead(id);
    }

    // ── Filter ────────────────────────────────────────────────────
    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderNotifications(allNotifications);
    }

    // ── Pagination ────────────────────────────────────────────────
    function renderPagination() {
      const el = document.getElementById('pagination');
      if (totalPages <= 1) { el.innerHTML = ''; return; }

      let html = `<button class="page-btn" onclick="loadNotifications(${currentPage - 1})"
        ${currentPage === 0 ? 'disabled' : ''}>← Prev</button>`;

      for (let i = 0; i < totalPages; i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}"
          onclick="loadNotifications(${i})">${i + 1}</button>`;
      }

      html += `<button class="page-btn" onclick="loadNotifications(${currentPage + 1})"
        ${currentPage >= totalPages - 1 ? 'disabled' : ''}>Next →</button>`;

      el.innerHTML = html;
    }

    // ── Demo fallback ─────────────────────────────────────────────
    function showDemoNotifications() {
      allNotifications = [
        { id: 1, type: 'OUTBID', title: 'You\'ve been outbid!', message: 'Someone placed a higher bid on Vintage Rolex Submariner. Current bid: $5,200', createdAt: new Date(Date.now() - 300000).toISOString(), read: false },
        { id: 2, type: 'BID_PLACED', title: 'Bid placed successfully', message: 'Your bid of $4,500 on Vintage Rolex Submariner was accepted.', createdAt: new Date(Date.now() - 600000).toISOString(), read: false },
        { id: 3, type: 'AUCTION_WON', title: '🏆 You won the auction!', message: 'Congratulations! You won the Original Abstract Painting for $1,200.', createdAt: new Date(Date.now() - 3600000).toISOString(), read: true },
        { id: 4, type: 'PAYMENT_SUCCESS', title: 'Payment successful', message: 'Payment of $1,200 for Original Abstract Painting was processed successfully.', createdAt: new Date(Date.now() - 7200000).toISOString(), read: true },
        { id: 5, type: 'AUCTION_ENDED', title: 'Auction ended', message: 'The auction for Gaming Laptop RTX 4090 has ended.', createdAt: new Date(Date.now() - 86400000).toISOString(), read: true },
      ];
      totalPages = 1;
      renderNotifications(allNotifications);
      updateUnreadBadge(2);
      showToast('Notification service offline — showing demo data', 'error');
    }

    // ── Toast ─────────────────────────────────────────────────────
    function showToast(msg, type = 'info') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast show ${type}`;
      setTimeout(() => t.className = 'toast', 3500);
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/index.html';
    }

    // Init
    loadNotifications();
</script>
<script src="/notification-bell.js"></script>
</body>
</html>
