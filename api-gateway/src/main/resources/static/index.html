<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuctionHub — Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'primary': '#f97316',
                        'primary-dark': '#ea580c',
                        'surface': '#13131a',
                        'background': '#0a0a0f',
                        'border': '#1e1e2e',
                    },
                    fontFamily: {
                        'syne': ['Syne', 'sans-serif'],
                        'sans': ['DM Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body { @apply bg-background text-gray-100 font-sans; }
            h1, h2, h3 { @apply font-syne font-bold; }
        }
        .hero-gradient {
            background: linear-gradient(135deg, #0f0a04 0%, #1a0f02 50%, #0a0a0f 100%);
        }
    </style>
</head>
<body class="min-h-screen flex overflow-hidden">
    <!-- Left Hero Panel -->
    <div class="hidden lg:flex flex-col justify-between w-1/2 p-12 hero-gradient relative overflow-hidden border-r border-border">
        <div class="relative z-10">
            <div class="text-2xl font-extrabold font-syne tracking-tight">
                Auction<span class="text-primary">Hub</span>
            </div>
        </div>

        <div class="relative z-10 max-w-lg">
            <span class="inline-block px-3 py-1 text-xs font-bold tracking-widest uppercase rounded-full bg-primary/10 border border-primary/30 text-primary mb-6">
                🔨 Live Bidding Platform
            </span>
            <h1 class="text-6xl mb-6 leading-[1.1]">
                Bid smart.<br>
                <span class="text-primary">Win big.</span>
            </h1>
            <p class="text-gray-400 text-lg leading-relaxed max-w-sm">
                Real-time auctions powered by cloud-native architecture. Every bid, every second, perfectly tracked.
            </p>
        </div>

        <div class="relative z-10 flex gap-12">
            <div>
                <div class="text-3xl font-bold font-syne">Live</div>
                <div class="text-xs text-gray-500 uppercase tracking-wider">Auctions now</div>
            </div>
            <div>
                <div class="text-3xl font-bold font-syne">Real-time</div>
                <div class="text-xs text-gray-500 uppercase tracking-wider">Bid updates</div>
            </div>
            <div>
                <div class="text-3xl font-bold font-syne">Secure</div>
                <div class="text-xs text-gray-500 uppercase tracking-wider">JWT auth</div>
            </div>
        </div>

        <!-- Decorative elements -->
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-primary/10 rounded-full blur-[100px]"></div>
        <div class="absolute -bottom-24 -right-24 w-64 h-64 bg-primary/5 rounded-full blur-[80px]"></div>
    </div>

    <!-- Right Auth Panel -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-surface">
        <div class="w-full max-w-md">
            <div id="auth-header" class="mb-8">
                <h2 class="text-3xl mb-2">Welcome back</h2>
                <p class="text-gray-400">Sign in to start bidding on live auctions</p>
            </div>

            <!-- Tabs -->
            <div class="flex p-1 mb-8 rounded-xl bg-background border border-border">
                <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-primary text-white">
                    Sign In
                </button>
                <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all text-gray-400 hover:text-white">
                    Register
                </button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">Email</label>
                    <input type="email" id="login-email" required placeholder="you@example.com"
                        class="w-full px-4 py-3 bg-background border border-border rounded-xl focus:outline-none focus:border-primary transition-colors">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••"
                        class="w-full px-4 py-3 bg-background border border-border rounded-xl focus:outline-none focus:border-primary transition-colors">
                </div>
                <button type="submit" class="w-full py-4 bg-primary hover:bg-primary-dark text-white rounded-xl font-bold font-syne transition-all transform active:scale-[0.98] shadow-lg shadow-primary/20">
                    Sign In →
                </button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="hidden space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">Username</label>
                    <input type="text" id="reg-username" required placeholder="johndoe"
                        class="w-full px-4 py-3 bg-background border border-border rounded-xl focus:outline-none focus:border-primary transition-colors">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">Email</label>
                    <input type="email" id="reg-email" required placeholder="you@example.com"
                        class="w-full px-4 py-3 bg-background border border-border rounded-xl focus:outline-none focus:border-primary transition-colors">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" id="reg-password" required placeholder="Min. 8 characters"
                        class="w-full px-4 py-3 bg-background border border-border rounded-xl focus:outline-none focus:border-primary transition-colors">
                </div>
                <button type="submit" class="w-full py-4 bg-primary hover:bg-primary-dark text-white rounded-xl font-bold font-syne transition-all transform active:scale-[0.98] shadow-lg shadow-primary/20">
                    Create Account →
                </button>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        // Redirect if already logged in
        if (API.isAuthenticated()) {
            window.location.href = "/auctions.html";
        }

        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const authHeaderH2 = document.querySelector('#auth-header h2');
        const authHeaderP = document.querySelector('#auth-header p');
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');

        function switchTab(tab) {
            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-primary text-white";
                tabRegister.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all text-gray-400 hover:text-white";
                authHeaderH2.textContent = "Welcome back";
                authHeaderP.textContent = "Sign in to start bidding on live auctions";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabLogin.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all text-gray-400 hover:text-white";
                tabRegister.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-primary text-white";
                authHeaderH2.textContent = "Create account";
                authHeaderP.textContent = "Join thousands of bidders on AuctionHub";
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            const btn = loginForm.querySelector('button');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const data = await API.auth.login(email, password);
                API.setToken(data.token);
                window.location.href = "/auctions.html";
            } catch (err) {
                UI.showToast(err.message || 'Login failed', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In →';
            }
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            if (password.length < 8) {
                UI.showToast('Password must be at least 8 characters', 'error');
                return;
            }

            const btn = registerForm.querySelector('button');
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                await API.auth.register({ name, email, password });
                UI.showToast('Account created! Please sign in.', 'success');
                setTimeout(() => switchTab('login'), 1500);
            } catch (err) {
                UI.showToast(err.message || 'Registration failed', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Account →';
            }
        });
    </script>
</body>
</html>
