server:
  port: 8080
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB

spring:
  web:
    resources:
      static-locations: classpath:/static/
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service-auth-public
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/register,/api/users/login,/api/users/status
              filters:
                - name: Retry
                  args:
                    retries: 2
                    methods: GET,POST
                    series: SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    id: userServiceCircuitBreaker
                    fallbackUri: forward:/fallback/users
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504

            - id: user-service-protected
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**
              filters:
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    series: SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    id: userServiceCircuitBreaker
                    fallbackUri: forward:/fallback/users
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504

            - id: auction-service
              uri: ${AUCTION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/auctions/**
              filters:
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    series: SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    id: auctionServiceCircuitBreaker
                    fallbackUri: forward:/fallback/auctions
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504

            - id: bid-service
              uri: ${BID_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/bids/**
              filters:
                - name: Retry
                  args:
                    retries: 1
                    methods: GET
                    series: SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    id: bidServiceCircuitBreaker
                    fallbackUri: forward:/fallback/bids
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/payments/**
              filters:
                - name: Retry
                  args:
                    retries: 1
                    methods: GET
                    series: SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    id: paymentServiceCircuitBreaker
                    fallbackUri: forward:/fallback/payments
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/notifications/**
              filters:
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    series: SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    id: notificationServiceCircuitBreaker
                    fallbackUri: forward:/fallback/notifications
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504

app:
  jwt:
    secret: ${JWT_SECRET}
  gateway:
    public-paths:
      - /api/users/register
      - /api/users/login
      - /api/users/status
      - /api/auctions/status
      - /api/bids/status
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /fallback/**
      - /
      - /index.html
      - /auctions.html
      - /bid.html
      - /js/**
      - /css/**


    role-rules:
      - pattern: /api/users/admin/**
        roles: [ADMIN]
      - pattern: /api/users/trusted/**
        roles: [TRUSTED_USER, ADMIN]
      - pattern: /api/auctions/create/**
        roles: [TRUSTED_USER, ADMIN]
      - pattern: /api/auctions/manage/**
        roles: [ADMIN]
      - pattern: /api/payments/refund/**
        roles: [ADMIN]
      - pattern: /api/notifications/admin/**
        roles: [ADMIN]
    rate-limit:
      enabled: true
      mode: redis
      max-requests: 60
      window-seconds: 60
      redis-key-prefix: "gateway:ratelimit:"
      fail-open: true
      exempt-paths:
        - /actuator/health/**
        - /actuator/info
        - /actuator/prometheus
        - /fallback/**
        - /
        - /*.html
        - /js/**
        - /css/**
    cors:
      allowed-origin-patterns:
        - ${ALLOWED_ORIGIN_PATTERN:http://localhost:*}
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - X-Request-Id
        - X-Forwarded-For
      exposed-headers:
        - X-Request-Id
        - X-Rate-Limit-Limit
        - X-Rate-Limit-Remaining
        - X-Rate-Limit-Reset
        - Retry-After
      allow-credentials: true
      max-age-seconds: 1800

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 5
        failureRateThreshold: 50
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 50
        waitDurationInOpenState: 30s
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      userServiceCircuitBreaker:
        baseConfig: default
      auctionServiceCircuitBreaker:
        baseConfig: default
      bidServiceCircuitBreaker:
        baseConfig: default
      paymentServiceCircuitBreaker:
        baseConfig: default
      notificationServiceCircuitBreaker:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
    instances:
      userServiceCircuitBreaker:
        baseConfig: default
      auctionServiceCircuitBreaker:
        baseConfig: default
      bidServiceCircuitBreaker:
        baseConfig: default
      paymentServiceCircuitBreaker:
        baseConfig: default
      notificationServiceCircuitBreaker:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  info:
    env:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      service: gateway
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} requestId=%X{requestId} - %msg%n"
info:
  app:
    name: ${spring.application.name}
    description: Cloud Auction API Gateway
    version: 0.0.1-SNAPSHOT
