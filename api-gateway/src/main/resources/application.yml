server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service-auth-public
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/register,/api/users/login,/api/users/status
            - id: user-service-protected
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**
            - id: auction-service
              uri: ${AUCTION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/auctions/**
            - id: bid-service
              uri: ${BID_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/bids/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/payments/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/notifications/**

app:
  jwt:
    secret: ${JWT_SECRET}
  gateway:
    public-paths:
      - /api/users/register
      - /api/users/login
      - /api/users/status
      - /actuator/health


    role-rules:
      - pattern: /api/users/admin/**
        roles: [ADMIN]
      - pattern: /api/users/trusted/**
        roles: [TRUSTED_USER, ADMIN]
      - pattern: /api/auctions/create/**
        roles: [TRUSTED_USER, ADMIN]
      - pattern: /api/auctions/manage/**
        roles: [ADMIN]
      - pattern: /api/payments/refund/**
        roles: [ADMIN]
      - pattern: /api/notifications/admin/**
        roles: [ADMIN]